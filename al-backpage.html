<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'JetBrains Mono', monospace;
    background: #FAFAF8;
    color: #1a1a1a;
    width: 148mm;
    min-height: 210mm;
    padding: 28mm 22mm;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .label {
    font-size: 8px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 20px;
  }
  .heading {
    font-family: 'Caveat', cursive;
    font-size: 36px;
    color: #FF4500;
    line-height: 1.1;
    margin-bottom: 12px;
  }
  .sub {
    font-size: 10px;
    line-height: 1.7;
    color: #444;
    max-width: 220px;
    margin: 0 auto 28px;
  }
  .qr-wrap {
    background: #fff;
    border: 1.5px solid #1a1a1a;
    padding: 12px;
    display: inline-block;
    margin-bottom: 16px;
  }
  .qr-wrap img {
    width: 130px;
    height: 130px;
    display: block;
  }
  .wa-label {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 24px;
  }
  .divider {
    width: 40px;
    border-top: 1px solid #ddd;
    margin: 0 auto 20px;
  }
  .note {
    font-size: 9.5px;
    color: #888;
    line-height: 1.6;
  }
  .url {
    font-size: 8.5px;
    color: #FF4500;
    margin-top: 8px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="label">This copy was shared with you personally</div>
  <div class="heading">What did<br>you think?</div>
  <p class="sub">Write Enzo directly. Not a reaction — an actual thought. The kind you'd share sitting at a table.</p>

  <div class="qr-wrap">
    <img src="tp-qr-whatsapp.png" alt="WhatsApp QR Code">
  </div>
  <div class="wa-label">Scan → WhatsApp</div>

  <div class="divider"></div>
  <div class="note">
    Ed reads every message personally.<br>
    If it sticks, it ends up in the book.
  </div>
  <div class="url">agentic-living.com/vip</div>
</body>
</html>
